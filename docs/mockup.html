<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piso — mockup de pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAEDE6;
    --ink:#22302A;
    --saffron:#E0A21A;
    --clay:#B8462E;
    --sage:#7C8A7F;
    --rule:#CBD2C6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#DDE1D8;
    font-family:'Archivo',system-ui,sans-serif;
    color:var(--ink);
    padding:40px 24px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{max-width:1520px;margin:0 auto}
  .sheet-head{margin-bottom:36px;max-width:60ch}
  .sheet-head h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:-.01em;
  }
  .sheet-head p{color:var(--sage);margin-top:8px;font-size:15px;line-height:1.55}

  .rail{
    display:flex;
    gap:36px;
    flex-wrap:wrap;
    align-items:flex-start;
  }
  .unit{width:330px}
  .unit figcaption{
    margin-top:14px;
    font-size:13px;
    color:var(--sage);
    line-height:1.5;
  }
  .unit figcaption b{color:var(--ink);font-weight:600;display:block}

  .phone{
    background:var(--paper);
    border:1px solid #C2C9BC;
    border-radius:30px;
    padding:22px 20px 26px;
    min-height:660px;
    display:flex;
    flex-direction:column;
    box-shadow:0 18px 40px -28px rgba(34,48,42,.7);
  }

  .chip-sim{
    align-self:flex-start;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--clay);
    border:1px solid var(--clay);
    border-radius:999px;
    padding:3px 10px;
    margin-bottom:20px;
  }

  .lede{
    font-family:'Fraunces',Georgia,serif;
    font-size:25px;
    line-height:1.2;
    letter-spacing:-.015em;
    margin-bottom:14px;
  }
  .situation{font-size:15px;line-height:1.6;color:#3A4A42;margin-bottom:24px}

  .opt{
    border:1px solid var(--rule);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    line-height:1.4;
    background:#F2F4EF;
    margin-bottom:10px;
  }
  .opt-picked{border-color:var(--ink);border-width:1.5px;background:#fff}

  .foot{
    margin-top:auto;
    padding-top:22px;
    font-size:12.5px;
    color:var(--sage);
    line-height:1.5;
  }

  .read{font-size:16px;line-height:1.6;color:#3A4A42;margin-bottom:24px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{
    font-size:13.5px;
    border:1px solid var(--rule);
    border-radius:999px;
    padding:6px 13px;
    background:#F2F4EF;
  }

  .card{
    border:1px solid var(--rule);
    border-radius:16px;
    padding:16px;
    background:#F2F4EF;
    margin-bottom:14px;
  }
  .card h3{font-size:16px;font-weight:600;line-height:1.3}
  .money{
    font-family:'Fraunces',Georgia,serif;
    font-size:31px;
    letter-spacing:-.02em;
    margin:10px 0 2px;
  }
  .money-label{font-size:12px;color:var(--sage);margin-bottom:12px}
  .care{
    display:inline-block;
    font-size:12px;
    background:var(--saffron);
    color:var(--ink);
    border-radius:999px;
    padding:4px 11px;
    margin-bottom:12px;
    font-weight:500;
  }
  .meta{
    display:flex;
    gap:14px;
    font-size:11.5px;
    color:var(--sage);
    border-top:1px solid var(--rule);
    padding-top:10px;
  }
  .payer{font-size:12.5px;color:var(--sage);margin-top:9px}

  .ledger{border-top:1px solid var(--rule);margin-top:6px}
  .row{
    display:flex;
    justify-content:space-between;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--rule);
    font-size:14px;
    line-height:1.4;
  }
  .row span:last-child{
    font-family:'Fraunces',Georgia,serif;
    font-size:19px;
    white-space:nowrap;
  }
  .good{color:var(--ink)}
  .miss{color:var(--clay)}
  .note{font-size:13px;line-height:1.6;color:#3A4A42;margin-top:18px}

  .empty{
    border:1px dashed var(--rule);
    border-radius:16px;
    padding:20px;
    font-size:15px;
    line-height:1.55;
    color:#3A4A42;
  }

  @media print{
    @page{ margin:12mm; }
    html,body{
      background:#fff;
      padding:0;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }
    .sheet-head{display:none}
    .rail{display:block}
    .unit{
      width:340px;
      margin:0 auto;
      break-inside:avoid;
      page-break-inside:avoid;
      break-after:page;
      page-break-after:always;
    }
    .unit:last-child{break-after:auto;page-break-after:auto}
    .phone{box-shadow:none;min-height:0}
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="sheet-head">
    <h1>Piso — pantallas</h1>
    <p>Cuatro pantallas de la rebanada de la Semana 4. Todo el contenido mostrado es simulado y está etiquetado en pantalla. Ninguna pantalla pregunta por la escuela, el pasado o el motivo de salida.</p>
  </div>

  <div class="rail">

    <!-- 1 -->
    <figure class="unit">
      <div class="phone">
        <span class="chip-sim">Datos simulados</span>
        <p class="lede">Son las dos de la tarde y acabas de llegar.</p>
        <p class="situation">Hay cuatro personas formadas, el refri de bebidas está vacío, el piso de la entrada está mojado, llegó una caja sin abrir y el teléfono está sonando.</p>
        <div class="opt">Atiendes la fila, lo demás espera</div>
        <div class="opt">Secas el piso, alguien se puede caer</div>
        <div class="opt">Contestas el teléfono, puede ser un pedido</div>
        <div class="opt">Llenas el refri, es lo que más se vende a esta hora</div>
        <p class="foot">No pedimos tu nombre. No preguntamos qué pasó antes.</p>
      </div>
      <figcaption><b>El turno · primer momento</b>Sin bienvenida, sin registro, sin numeración ni barra de avance. La primera pantalla ya es la tarea.</figcaption>
    </figure>

    <!-- 2 -->
    <figure class="unit">
      <div class="phone">
        <span class="chip-sim">Datos simulados</span>
        <p class="lede">Esto es lo que leí de tu turno.</p>
        <p class="read">Resuelves sola cuando algo se descompone, atiendes primero a quien está esperando y escribes claro cuando alguien está molesto.</p>
        <div class="tags">
          <span class="tag">Atención a clientes</span>
          <span class="tag">Resuelve sin supervisión</span>
          <span class="tag">Manejo de efectivo</span>
          <span class="tag">Trato con gente molesta</span>
          <span class="tag">Prioriza bajo presión</span>
        </div>
        <p class="foot">Esto describe lo que sabes hacer. No dice a dónde deberías ir — eso lo decides tú.</p>
      </div>
      <figcaption><b>Señales</b>Capacidades como palabras, nunca como puntaje, barras ni estrellas. El sistema describe; no recomienda.</figcaption>
    </figure>

    <!-- 3 -->
    <figure class="unit">
      <div class="phone">
        <span class="chip-sim">Datos simulados</span>
        <p class="lede">Tres lugares que pasan el piso.</p>

        <div class="card">
          <h3>Mostrador · panadería, Lindavista</h3>
          <p class="money">$9,800</p>
          <p class="money-label">piso mensual, por escrito</p>
          <span class="care">Compatible con turnos de cuidado</span>
          <div class="meta"><span>Confianza media</span><span>Dato de hace 2 meses</span></div>
          <p class="payer">Lo paga: Panificadora Sur, empleador</p>
        </div>

        <div class="card">
          <h3>Caja · farmacia, Ecatepec</h3>
          <p class="money">$9,200</p>
          <p class="money-label">piso mensual, por escrito</p>
          <div class="meta"><span>Confianza alta</span><span>Dato de hace 3 semanas</span></div>
          <p class="payer">Lo paga: Red Salud Local, ONG</p>
        </div>

        <div class="card">
          <h3>Almacén · papelería mayorista</h3>
          <p class="money">$10,400</p>
          <p class="money-label">piso mensual, por escrito</p>
          <span class="care">Compatible con turnos de cuidado</span>
          <div class="meta"><span>Confianza baja</span><span>Dato de hace 7 meses</span></div>
          <p class="payer">Lo paga: Distribuidora Aztlán, empleador</p>
        </div>

        <p class="foot">Nueve lugares no aparecen aquí porque no pasaron el piso.</p>
      </div>
      <figcaption><b>Destinos</b>El piso salarial es lo más grande de la tarjeta. Ninguna tarjeta se dibuja sin su insignia de confianza y su antigüedad del dato.</figcaption>
    </figure>

    <!-- 4 -->
    <figure class="unit">
      <div class="phone">
        <span class="chip-sim">Datos simulados</span>
        <p class="lede">Quién paga esto.</p>
        <p class="read">Lo pagan empleadores y organizaciones. Nunca tú, nunca tu familia.</p>
        <div class="ledger">
          <div class="row"><span>Personas colocadas</span><span>184</span></div>
          <div class="row"><span class="good">Se fueron de un lugar que marcamos en riesgo — el filtro funcionó</span><span class="good">31</span></div>
          <div class="row"><span class="miss">Se fueron de un lugar que no marcamos — esto sí falló</span><span class="miss">7</span></div>
        </div>
        <p class="note">A quien paga no le cobramos por cuánta gente se queda. Le cobramos por qué tan bien avisamos antes. Un sistema al que le pagan por retenerte tiene motivo para callarse cuando dudas.</p>
        <p class="foot">Esta pantalla no muestra datos de ninguna persona.</p>
      </div>
      <figcaption><b>Quién paga</b>Hace visible la condición #4. Irse de un lugar marcado cuenta como acierto del filtro, no como fracaso.</figcaption>
    </figure>

    <!-- 5 -->
    <figure class="unit">
      <div class="phone">
        <span class="chip-sim">Datos simulados</span>
        <p class="lede">Hoy no hay lugares que pasen el piso.</p>
        <div class="empty">
          Revisamos catorce lugares. Ninguno cumple el piso de sueldo, las condiciones por escrito o la compatibilidad de horario.<br><br>
          Vuelve con este mismo enlace. Tu turno queda guardado.
        </div>
        <p class="foot">El problema está en los lugares, no en tu turno.</p>
      </div>
      <figcaption><b>Estado vacío</b>La pantalla que decide si el producto es honesto. El problema se ubica en el mercado, y no se sugiere repetir la tarea.</figcaption>
    </figure>

  </div>
</div>
</body>
</html>
